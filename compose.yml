services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.bright
    environment:
      NODE_ENV: production
      DJANGO_SETTINGS_MODULE: sentry.conf.server
      SENTRY_POSTGRES_HOST: db
      SENTRY_POSTGRES_PORT: "5432"
      SENTRY_DB_NAME: postgres
      SENTRY_DB_USER: postgres
      SENTRY_DB_PASSWORD: postgres
      SENTRY_REDIS_HOST: redis
      SENTRY_REDIS_PORT: "6379"
      SENTRY_SECRET_KEY: change-me-to-a-long-random-secret
      SENTRY_SINGLE_ORGANIZATION: "1"
      GRPC_POLL_STRATEGY: epoll1
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:9000/_health/', timeout=5); import sys; sys.exit(0 if r.status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db-data:
  redis-data:
