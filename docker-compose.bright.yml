services:
  redis:
    image: redis:7-alpine
  db:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
  web:
    build:
      context: .
      dockerfile: Dockerfile.bright
    environment:
      SENTRY_SECRET_KEY: insecure-dev-secret-key-for-dast
      SENTRY_POSTGRES_HOST: db
      SENTRY_POSTGRES_PORT: "5432"
      SENTRY_REDIS_HOST: redis
      SENTRY_REDIS_PORT: "6379"
    depends_on:
      - db
      - redis
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:9000/_health/', timeout=5); import sys; sys.exit(0 if r.status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 2m
